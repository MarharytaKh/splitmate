name: Mirror to GitLab

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ vars.GITLAB_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_REPO }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_REPO}.git"
          git push gitlab "HEAD:${GITHUB_REF}" --force
